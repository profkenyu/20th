    <style>
      :root {
        color-scheme: light;
        --paper: #fbfbfa;
        --ink: #10100f;
        --dim: #9a9a97;
        --signal: #c65d22;
        --green: #536e5b;
        --pad: max(16px, 1.875vw);
        --columns: 4.06vw 16.4vw 16.4vw minmax(84px, 1fr);
        --row: 20px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--paper);
      }
      body {
        overflow-x: hidden;
        color: var(--ink);
        font-family: Arial, Helvetica, "Noto Sans KR", sans-serif;
        font-size: clamp(13px, 1.17vw, 18px);
        line-height: 1.333;
        -webkit-font-smoothing: antialiased;
      }
      button,
      a {
        color: inherit;
        font: inherit;
      }
      button {
        border: 0;
      }
      .site-header {
        position: fixed;
        z-index: 20;
        inset: 0 0 auto;
        height: 56px;
        display: grid;
        grid-template-columns: var(--columns);
        align-items: start;
        padding: 16px var(--pad) 0;
        background: rgba(251, 251, 250, 0.96);
      }
      .monogram {
        grid-column: 1 / 3;
        display: grid;
        grid-template-columns: 4.06vw 1fr;
        margin: 0;
        font-size: inherit;
        font-weight: 400;
        line-height: 20px;
      }
      .filters {
        grid-column: 3 / 5;
        display: flex;
        gap: 0;
        min-width: 0;
        white-space: nowrap;
      }
      .filter {
        position: relative;
        padding: 0 12px 4px 0;
        background: transparent;
        color: var(--dim);
        line-height: 20px;
        cursor: pointer;
      }
      .filter:hover,
      .filter:focus-visible,
      .filter[aria-pressed="true"] {
        color: var(--ink);
        outline: none;
      }
      .filter[aria-pressed="true"]::after {
        content: "";
        position: absolute;
        right: 12px;
        bottom: 0;
        left: 0;
        height: 1px;
        background: var(--signal);
      }
      .back {
        position: absolute;
        top: 16px;
        right: var(--pad);
        color: var(--dim);
        line-height: 20px;
        text-decoration: none;
      }
      .back:hover,
      .back:focus-visible {
        color: var(--ink);
        outline: none;
      }
      .archive {
        min-height: 100dvh;
        padding-top: 64px;
      }
      .ledger-head,
      .record {
        display: grid;
        grid-template-columns: var(--columns);
        align-items: center;
        padding-inline: var(--pad);
      }
      .ledger-head {
        height: 40px;
        align-items: start;
        color: var(--ink);
      }
      #fa-ledger {
        position: relative;
        min-height: calc(100dvh - 150px);
      }
      .record {
        position: relative;
        z-index: 4;
        width: 100%;
        height: var(--row);
        margin: 0;
        padding-block: 0;
        overflow: visible;
        background: transparent;
        color: var(--dim);
        line-height: var(--row);
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
      }
      .record:hover,
      .record:focus-visible,
      .record[aria-pressed="true"] {
        color: #fff;
        outline: none;
        mix-blend-mode: difference;
      }
      .record[data-role="evidence"] {
        color: var(--ink);
      }
      .record[data-role="potential"] {
        opacity: 0.36;
      }
      .record[data-role="potential"]:hover,
      .record[data-role="potential"]:focus-visible,
      .record[data-role="potential"][aria-pressed="true"] {
        opacity: 1;
      }
      .record > span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .record-number {
        grid-column: 1;
      }
      .record-planet {
        grid-column: 2;
      }
      .record-label {
        grid-column: 3;
      }
      .status {
        grid-column: 4;
      }
      .status.evidence {
        color: var(--signal);
      }
      .status.potential {
        color: var(--green);
      }
      .empty-ledger {
        margin: 0;
        padding: 0 var(--pad);
        color: var(--dim);
        line-height: var(--row);
      }
      .selection-line {
        position: fixed;
        z-index: 8;
        left: 12px;
        right: 12px;
        top: 0;
        height: var(--row);
        border: 1px solid var(--signal);
        opacity: 0;
        pointer-events: none;
      }
      .selection-line.on {
        opacity: 1;
      }
      .preview {
        --preview-top: 124px;
        --capture-aspect: 2.392;
        position: fixed;
        z-index: 2;
        top: var(--preview-top);
        left: 26.4vw;
        width: 47.5vw;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preview.on {
        opacity: 1;
        visibility: visible;
      }
      .frame {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        aspect-ratio: var(--capture-aspect);
        overflow: hidden;
        background: #0b0b0a;
      }
      .frame.empty {
        border: 1px solid #c9c9c5;
        background: #f3f3f0;
      }
      #fa-image {
        position: absolute;
        inset: 0;
        display: none;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        object-fit: cover;
      }
      #fa-image.on {
        display: block;
      }
      .no-image {
        display: grid;
        gap: 5px;
        justify-items: center;
        color: #8e8e8b;
        text-align: center;
      }
      .no-image i {
        display: block;
        width: 26px;
        height: 1px;
        background: var(--signal);
      }
      .no-image b,
      .no-image span {
        font-size: 9px;
        font-weight: 400;
        letter-spacing: 0.08em;
      }
      .footer {
        position: fixed;
        z-index: 1;
        right: var(--pad);
        bottom: 16px;
        left: var(--pad);
        display: flex;
        justify-content: space-between;
        gap: 14px;
        color: var(--dim);
        font-size: 9px;
        line-height: 1.4;
        pointer-events: none;
      }
      .sr-only {
