    <script>
      (() => {
        // works/shared/exhibition-store.js
        var EXHIBITION_DB = "beyond-known-place-v1";

        function openExhibition() {

            const request = indexedDB.open(EXHIBITION_DB, 1);
            request.onupgradeneeded = () => {
              for (const name of ["world", "frames", "vehicles"])
                request.result.createObjectStore(name, { keyPath: "id" });

            connection = null;
            throw error;
          });
          return connection;
        }
        async function readExhibition() {
          const db = await openExhibition();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(["world", "frames", "vehicles"], "readonly");
            const world = tx.objectStore("world").get("basin");
            const frames = tx.objectStore("frames").getAll();
            const vehicles = tx.objectStore("vehicles").getAll();
            tx.oncomplete = () =>
              resolve({
                version: 1,
                scope: "this-browser-and-address",
                world: world.result ?? null,
                frames: frames.result,
                vehicles: vehicles.result,

            tx.onabort = () => reject(tx.error || new Error("Storage read aborted"));

        // works/shared/place-archive-view.js

            "p",

          );

          try {
            const data = await readExhibition();
            const frames = data.frames
              .filter((r) => imageOK(r.image) && Number.isFinite(r.seconds))
              .sort((a, b) => a.seconds - b.seconds);
            if (!frames.length) {
              section.append(
                el("p", "아직 장소의 변화 기록이 없습니다. 도착 이후 실제 상태를 촬영합니다."),

            const aftermath = frames.filter((r) => r.stage === "aftermath");
            for (const [label, r] of [
              ["개입 이전", before],
              ["설비 가동", intervention],
              ["이후 경과", aftermath.at(-1)],

            const regions = el(
              "p",
              "기존 경계 지역과 회수 설비 주변을 함께 기록합니다. 휴지는 실패 판정이 아니며, 거주 가능성은 행성 전체가 아닌 설정된 밀폐 설비의 운용 조건입니다.",

              const img = el("img");
              img.src = r.image;
              img.alt = "같은 좌표의 기록";
              img.loading = "lazy";
              img.width = 640;
              img.height = 400;

                  el(
                    "p",
                    `${zone.side < 0 ? "왼쪽" : zone.side > 0 ? "오른쪽" : "중앙"} ${zone.zone} · 얼음 ${zone.ice.toFixed(3)} / 액체 ${zone.liquid.toFixed(3)} kg/m²`,

            const vehicles = data.vehicles;

                  img = el("img");

            section.append(
              el(
                "p",
                "최초 개입 전·가동 기록과 최근 32개 경과를 보관합니다. 브라우저 데이터 삭제 시 지워지며, 다른 기기와 자동 공유되지 않습니다.",
              ),

        // works/shared/vehicle-archive.js
        var VEHICLE_ARCHIVE_KEY = "terra-incognita:vehicle-archive:v1";
