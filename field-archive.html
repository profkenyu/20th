<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfa" />
    <title> BEYOND THE KNOWN - A Terraforming Project · FIELD ARCHIVE / COORDINATE RECORDS </title>
    <link rel="stylesheet" href="../../engine/fonts.css" />
    <style>
      :root {
        color-scheme: light;
        --paper: #fbfbfa;
        --ink: #10100f;
        --dim: #9a9a97;
        --signal: #c65d22;
        --green: #536e5b;
        --pad: max(16px, 1.875vw);
        --columns: 4.06vw 16.4vw 16.4vw minmax(84px, 1fr);
        --row: 20px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--paper);
      }
      body {
        overflow-x: hidden;
        color: var(--ink);
        font-family: Arial, Helvetica, "Noto Sans KR", sans-serif;
        font-size: clamp(13px, 1.17vw, 18px);
        line-height: 1.333;
        -webkit-font-smoothing: antialiased;
      }
      button,
      a {
        color: inherit;
        font: inherit;
      }
      button {
        border: 0;
      }
      .site-header {
        position: fixed;
        z-index: 20;
        inset: 0 0 auto;
        height: 56px;
        display: grid;
        grid-template-columns: var(--columns);
        align-items: start;
        padding: 16px var(--pad) 0;
        background: rgba(251, 251, 250, 0.96);
      }
      .monogram {
        grid-column: 1 / 3;
        display: grid;
        grid-template-columns: 4.06vw 1fr;
        margin: 0;
        font-size: inherit;
        font-weight: 400;
        line-height: 20px;
      }
      .filters {
        grid-column: 3 / 5;
        display: flex;
        gap: 0;
        min-width: 0;
        white-space: nowrap;
      }
      .filter {
        position: relative;
        padding: 0 12px 4px 0;
        background: transparent;
        color: var(--dim);
        line-height: 20px;
        cursor: pointer;
      }
      .filter:hover,
      .filter:focus-visible,
      .filter[aria-pressed="true"] {
        color: var(--ink);
        outline: none;
      }
      .filter[aria-pressed="true"]::after {
        content: "";
        position: absolute;
        right: 12px;
        bottom: 0;
        left: 0;
        height: 1px;
        background: var(--signal);
      }
      .back {
        position: absolute;
        top: 16px;
        right: var(--pad);
        color: var(--dim);
        line-height: 20px;
        text-decoration: none;
      }
      .back:hover,
      .back:focus-visible {
        color: var(--ink);
        outline: none;
      }
      .archive {
        min-height: 100dvh;
        padding-top: 64px;
      }
      .ledger-head,
      .record {
        display: grid;
        grid-template-columns: var(--columns);
        align-items: center;
        padding-inline: var(--pad);
      }
      .ledger-head {
        height: 40px;
        align-items: start;
        color: var(--ink);
      }
      #fa-ledger {
        position: relative;
        min-height: calc(100dvh - 150px);
      }
      .record {
        position: relative;
        z-index: 4;
        width: 100%;
        height: var(--row);
        margin: 0;
        padding-block: 0;
        overflow: visible;
        background: transparent;
        color: var(--dim);
        line-height: var(--row);
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
      }
      .record:hover,
      .record:focus-visible,
      .record[aria-pressed="true"] {
        color: #fff;
        outline: none;
        mix-blend-mode: difference;
      }
      .record[data-role="evidence"] {
        color: var(--ink);
      }
      .record[data-role="potential"] {
        opacity: 0.36;
      }
      .record[data-role="potential"]:hover,
      .record[data-role="potential"]:focus-visible,
      .record[data-role="potential"][aria-pressed="true"] {
        opacity: 1;
      }
      .record > span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .record-number {
        grid-column: 1;
      }
      .record-planet {
        grid-column: 2;
      }
      .record-label {
        grid-column: 3;
      }
      .status {
        grid-column: 4;
      }
      .status.evidence {
        color: var(--signal);
      }
      .status.potential {
        color: var(--green);
      }
      .empty-ledger {
        margin: 0;
        padding: 0 var(--pad);
        color: var(--dim);
        line-height: var(--row);
      }
      .selection-line {
        position: fixed;
        z-index: 8;
        left: 12px;
        right: 12px;
        top: 0;
        height: var(--row);
        border: 1px solid var(--signal);
        opacity: 0;
        pointer-events: none;
      }
      .selection-line.on {
        opacity: 1;
      }
      .preview {
        --preview-top: 124px;
        --capture-aspect: 2.392;
        position: fixed;
        z-index: 2;
        top: var(--preview-top);
        left: 26.4vw;
        width: 47.5vw;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preview.on {
        opacity: 1;
        visibility: visible;
      }
      .frame {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        aspect-ratio: var(--capture-aspect);
        overflow: hidden;
        background: #0b0b0a;
      }
      .frame.empty {
        border: 1px solid #c9c9c5;
        background: #f3f3f0;
      }
      #fa-image {
        position: absolute;
        inset: 0;
        display: none;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        object-fit: cover;
      }
      #fa-image.on {
        display: block;
      }
      .no-image {
        display: grid;
        gap: 5px;
        justify-items: center;
        color: #8e8e8b;
        text-align: center;
      }
      .no-image i {
        display: block;
        width: 26px;
        height: 1px;
        background: var(--signal);
      }
      .no-image b,
      .no-image span {
        font-size: 9px;
        font-weight: 400;
        letter-spacing: 0.08em;
      }
      .footer {
        position: fixed;
        z-index: 1;
        right: var(--pad);
        bottom: 16px;
        left: var(--pad);
        display: flex;
        justify-content: space-between;
        gap: 14px;
        color: var(--dim);
        font-size: 9px;
        line-height: 1.4;
        pointer-events: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .exports {
        display: flex;
        gap: 12px;
        pointer-events: auto;
      }
      .exports button {
        background: none;
        padding: 8px 0;
        color: var(--ink);
        font-size: 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      .exports button:focus-visible {
        outline: 1px solid var(--signal);
        outline-offset: 3px;
      }
      .footer {
        z-index: 9;
        align-items: center;
        background: var(--paper);
      }
      .archive {
        padding-bottom: 60px;
      }
      #fa-observation-data {
        font: 9px/1.6 monospace;
        letter-spacing: 0.05em;
        color: var(--ink);
        margin: 8px 0 0;
        padding: 6px 8px;
        background: var(--paper);
        max-height: 46px;
        overflow: auto;
      }
      @media (max-width: 700px) {
        :root {
          --columns: 42px 72px minmax(0, 1fr) 62px;
          --row: 42px;
        }
        body {
          font-size: 12px;
        }
        .site-header {
          height: 82px;
          grid-template-columns: 42px 72px minmax(0, 1fr);
          padding-top: max(14px, env(safe-area-inset-top));
        }
        .monogram {
          grid-column: 1 / 3;
          grid-template-columns: 42px 1fr;
          line-height: 20px;
        }
        .filters {
          position: absolute;
          top: 46px;
          left: var(--pad);
          right: var(--pad);
          display: flex;
          overflow-x: auto;
          scrollbar-width: none;
        }
        .filters::-webkit-scrollbar {
          display: none;
        }
        .filter {
          padding-right: 10px;
        }
        .back {
          top: max(14px, env(safe-area-inset-top));
        }
        .archive {
          padding-top: 92px;
        }
        .ledger-head {
          height: 34px;
          font-size: 11px;
        }
        #fa-ledger {
          min-height: calc(100dvh - 158px);
        }
        .record {
          font-size: 11px;
          line-height: var(--row);
        }
        .selection-line {
          left: 7px;
          right: 7px;
        }
        .preview {
          top: auto;
          right: auto;
          bottom: 42px;
          left: 50%;
          width: calc(100vw - var(--pad) * 2);
          max-height: calc(100dvh - 142px);
          overflow: hidden;
          transform: translateX(-50%);
          z-index: 7;
        }
        .preview.on {
          box-shadow: 0 0 0 5px var(--paper);
        }
        .footer {
          bottom: 12px;
          font-size: 8px;
        }
        #fa-footer {
          display: none;
        }
        .footer {
          justify-content: flex-end;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .preview,
        .selection-line {
          transition: none;
        }
      }
      .vehicle-archive {
        padding: 32px var(--pad) 90px;
        border-top: 1px solid var(--dim);
      }
      .vehicle-archive h2 {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.12em;
      }
      .vehicle-archive p {
        font-size: 11px;
        line-height: 1.8;
        color: var(--dim);
      }
      .vehicle-archive details {
        border-bottom: 1px solid #bbb;
        padding: 14px 0;
      }
      .vehicle-archive summary {
        cursor: pointer;
        font-size: 12px;
        line-height: 1.8;
      }
      .vehicle-archive img {
        display: block;
        max-width: 100%;
        max-height: 65vh;
        margin: 18px auto;
        object-fit: contain;
      }
      .vehicle-archive dl {
        display: grid;
        grid-template-columns: minmax(80px, 1fr) 3fr;
        gap: 8px;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .vehicle-archive dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="site-header">
        <h1 class="monogram" aria-label="Field Archive / Coordinate Records">
          <span>F.</span><span>A.</span
          ><span class="sr-only">Field Archive / Coordinate Records</span>
        </h1>
        <nav class="filters" aria-label="Filter records by planet">
          <button class="filter" type="button" data-filter="all" aria-pressed="true"> All </button>
          <button class="filter" type="button" data-filter="terra" aria-pressed="false">
            Planet 01
          </button>
          <button class="filter" type="button" data-filter="desert" aria-pressed="false">
            Planet 02
          </button>
          <button class="filter" type="button" data-filter="granite" aria-pressed="false">
            Planet 03
          </button>
        </nav>
        <span id="fa-count" class="sr-only" aria-live="polite">00 / 00 observations recorded</span>
        <a class="back" href="planet-01.html" data-return>Return to Mission</a>
      </header>
      <section class="archive" aria-label="Coordinate observation records">
        <div class="ledger-head" aria-hidden="true">
          <span>No.</span><span>Planet</span><span>Site</span><span>Status</span>
        </div>
        <section class="ledger" aria-label="Coordinate ledger">
          <div id="fa-ledger"></div>
        </section>
        <section id="fa-preview" class="preview" aria-live="polite">
          <div class="frame empty">
            <img id="fa-image" alt="Field observation captured by the rover" />
            <div id="fa-empty" class="no-image">
              <i></i><b>NO IMAGE</b><span>FRAME NOT CAPTURED</span>
            </div>
          </div>
          <p id="fa-observation-data"></p>
        </section>
        <div id="fa-selection" class="selection-line" aria-hidden="true"></div>
      </section>
      <footer class="footer">
        <span>©2026 KIM GUNWOO. ALL RIGHTS RESERVED.</span>
        <div class="exports" aria-label="Export all field records">
          <button type="button" data-export="json" title="All records and captured images">
            EXPORT JSON</button
          ><button type="button" data-export="csv" title="Coordinates and observation metadata">
            EXPORT CSV
          </button>
        </div>
        <span id="fa-footer">No field observations in this session.</span>
      </footer>
      <span id="fa-export-status" class="sr-only" role="status"></span>
    </main>
    <script>
      (() => {
        // works/shared/vehicle-archive.js
        var VEHICLE_ARCHIVE_KEY = "terra-incognita:vehicle-archive:v1";
        var kinds = /* @__PURE__ */ new Set(["rover", "surveyor", "fleet"]);
        var contexts = /* @__PURE__ */ new Set([
          "terra",
          "desert",
          "granite",
          "migration",
          "arrival",
        ]);
        function readVehicleArchive(storage) {
          try {
            const source = JSON.parse(storage.getItem(VEHICLE_ARCHIVE_KEY) || "null");
            if (source?.version !== 1) return [];
            return (Array.isArray(source.records) ? source.records : [])
              .slice(0, 8)
              .filter(
                (r) =>
                  r &&
                  r.id === `${r.kind}:${r.context}` &&
                  kinds.has(r.kind) &&
                  contexts.has(r.context) &&
                  typeof r.image === "string" &&
                  r.image.length < 1e5 &&
                  /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(r.image) &&
                  Number.isFinite(r.seconds) &&
                  r.status &&
                  typeof r.status === "object",
              );
          } catch {
            return [];
          }
        }

        // engine/core/field-archive.js
        var FIELD_ARCHIVE_VERSION = 4;
        var DEFAULT_FIELD_ARCHIVE_KEY = "terra-incognita:field-archive:v4";
        var FIELD_ARCHIVE_CAPACITY = 24;
        var finite = (value, fallback = 0) =>
          Number.isFinite(Number(value)) ? Number(value) : fallback;
        var clamp = (value, min, max) => Math.max(min, Math.min(max, value));
        var ARCHIVE_TRANSLATIONS = Object.freeze([
          ["철-니켈 합금 시료", "IRON–NICKEL ALLOY SAMPLE"],
          ["규산염 세라믹 시료", "SILICATE CERAMIC SAMPLE"],
          ["탄소 복합재 시료", "CARBON COMPOSITE SAMPLE"],
          ["전도성 격자 시료", "CONDUCTIVE LATTICE SAMPLE"],
          ["분자 질소(N₂) 서리층", "MOLECULAR NITROGEN (N₂) FROST"],
          ["에탄올 결정상", "ETHANOL CRYSTALLINE PHASE"],
          ["조사 지점", "SITE"],
          ["관측 증거", "SAMPLE RECORD"],
          ["후보 지점", "MODEL CANDIDATE"],
        ]);
        function archiveEnglish(value, fallback = "UNRESOLVED DATUM") {
          let text = String(value ?? fallback);
          for (const [ko, en] of ARCHIVE_TRANSLATIONS) text = text.replaceAll(ko, en);
          text = text
            .replace(/\bFIELD (\d+)\b/g, "SITE $1")
            .replace(/\bRESOLVED POTENTIAL\b/g, "MODEL CANDIDATE");
          return /[\uac00-\ud7a3]/.test(text) ? fallback : text;
        }
        function archiveImage(value) {
          return typeof value === "string" &&
            value.length <= 9e5 &&
            /^data:image\/(?:png|jpeg|webp);base64,[a-z0-9+/=\s]+$/i.test(value)
            ? value
            : null;
        }
        var CAPTURE_SCHEDULE = Object.freeze({
          terra: Object.freeze(["fisheye", "wide", "tele", "macro", "rear", "panorama"]),
          desert: Object.freeze([
            "wide",
            "tele",
            "fisheye",
            "portrait",
            "rear",
            "macro",
            "panorama",
          ]),
          granite: Object.freeze(["panorama", "macro", "portrait", "tele", "fisheye"]),
        });
        var ARCHIVE_CAPTURE_PROFILES = Object.freeze({
          fisheye: Object.freeze({
            lens: "FISHEYE 8MM",
            viewpoint: "MAST / FORWARD",
            aspect: 1,
            zoom: 1.04,
            focusX: 0.5,
            focusY: 0.52,
            projection: "fisheye",
          }),
          wide: Object.freeze({
            lens: "ULTRAWIDE 18MM",
            viewpoint: "LOW FRONT",
            aspect: 16 / 9,
            zoom: 1.08,
            focusX: 0.5,
            focusY: 0.56,
            projection: "rectilinear",
          }),
          rear: Object.freeze({
            lens: "STANDARD 35MM",
            viewpoint: "REAR FOLLOW",
            aspect: 3 / 2,
            zoom: 1.28,
            focusX: 0.5,
            focusY: 0.53,
            projection: "rectilinear",
          }),
          tele: Object.freeze({
            lens: "TELEPHOTO 120MM",
            viewpoint: "MATERIAL FACE",
            aspect: 4 / 3,
            zoom: 2.24,
            focusX: 0.53,
            focusY: 0.5,
            projection: "rectilinear",
          }),
          macro: Object.freeze({
            lens: "MACRO 90MM",
            viewpoint: "GROUND CLOSE",
            aspect: 4 / 5,
            zoom: 2.82,
            focusX: 0.5,
            focusY: 0.68,
            projection: "rectilinear",
          }),
          portrait: Object.freeze({
            lens: "WIDE 24MM",
            viewpoint: "LATERAL RISE",
            aspect: 3 / 4,
            zoom: 1.6,
            focusX: 0.64,
            focusY: 0.5,
            projection: "rectilinear",
          }),
          panorama: Object.freeze({
            lens: "PANORAMA 24MM",
            viewpoint: "HORIZON SWEEP",
            aspect: 2.39,
            zoom: 1.04,
            focusX: 0.46,
            focusY: 0.5,
            projection: "rectilinear",
          }),
        });
        var stationOrder = (source) => {
          const explicit = finite(source?.order, NaN);
          if (Number.isFinite(explicit)) return Math.max(0, Math.floor(explicit));
          const fromId = String(source?.id ?? "").match(/-(\d+)$/);
          return fromId ? Math.max(0, Number(fromId[1]) - 1) : 0;
        };
        function archiveCaptureProfile(source = {}) {
          const body = String(source?.body ?? "terra");
          const schedule = CAPTURE_SCHEDULE[body] ?? CAPTURE_SCHEDULE.terra;
          const requested = String(
            source?.capture?.profile ?? schedule[stationOrder(source) % schedule.length],
          );
          const base = ARCHIVE_CAPTURE_PROFILES[requested] ?? ARCHIVE_CAPTURE_PROFILES.wide;
          const capture = source?.capture ?? {};
          return {
            profile: ARCHIVE_CAPTURE_PROFILES[requested] ? requested : "wide",
            lens: archiveEnglish(capture.lens, base.lens),
            viewpoint: archiveEnglish(capture.viewpoint, base.viewpoint),
            aspect: clamp(finite(capture.aspect, base.aspect), 0.5, 2.5),
            zoom: clamp(finite(capture.zoom, base.zoom), 1, 3.2),
            focusX: clamp(finite(capture.focusX, base.focusX), 0, 1),
            focusY: clamp(finite(capture.focusY, base.focusY), 0, 1),
            projection: ["fisheye", "rectilinear"].includes(capture.projection)
              ? capture.projection
              : base.projection,
          };
        }
        function cleanStation(source) {
          return {
            id: String(source?.id ?? "UNRESOLVED"),
            body: String(source?.body ?? "terra"),
            planet: String(source?.planet ?? "PLANET 01"),
            world: String(source?.world ?? "UNRESOLVED SURFACE"),
            label: archiveEnglish(source?.label),
            x: finite(source?.x),
            z: finite(source?.z),
            radius: clamp(finite(source?.radius, 10), 1, 120),
            order: stationOrder(source),
            resourceItem:
              source?.resourceItem == null
                ? null
                : Math.max(0, Math.floor(finite(source.resourceItem))),
            resourceVariant:
              source?.resourceVariant == null
                ? null
                : Math.max(0, Math.floor(finite(source.resourceVariant))),
            archiveRole: ["unresolved", "evidence", "potential"].includes(source?.archiveRole)
              ? source.archiveRole
              : "unresolved",
            potentialCount: Math.max(0, Math.floor(finite(source?.potentialCount))),
            resolved: !!source?.resolved,
            capture: archiveCaptureProfile(source),
          };
        }
        function archiveData(value, depth = 0) {
          if (depth > 5) return null;
          if (typeof value === "number") return Number.isFinite(value) ? value : null;
          if (typeof value === "boolean" || value === null) return value;
          if (typeof value === "string") return value.slice(0, 240);
          if (Array.isArray(value)) return value.slice(0, 24).map((v) => archiveData(v, depth + 1));
          if (value && typeof value === "object")
            return Object.fromEntries(
              Object.entries(value)
                .filter(([k]) => !["__proto__", "constructor", "prototype"].includes(k))
                .slice(0, 32)
                .map(([k, v]) => [k, archiveData(v, depth + 1)]),
            );
          return null;
        }
        function cleanRecord(source) {
          const image = archiveImage(source?.image);
          const capture = archiveCaptureProfile(source);
          const imageWidth = Math.max(0, Math.floor(finite(source?.imageWidth)));
          const imageHeight = Math.max(0, Math.floor(finite(source?.imageHeight)));
          return {
            id: String(source?.id ?? "UNRESOLVED"),
            body: String(source?.body ?? "terra"),
            planet: String(source?.planet ?? "PLANET 01"),
            world: String(source?.world ?? "UNRESOLVED SURFACE"),
            label: archiveEnglish(source?.label),
            x: finite(source?.x),
            z: finite(source?.z),
            heading: finite(source?.heading),
            shot: String(source?.shot ?? "WIDE"),
            frame: Math.max(0, Math.floor(finite(source?.frame))),
            capturedAt: Math.max(0, finite(source?.capturedAt)),
            kind: source?.kind === "resource-evidence" ? "resource-evidence" : "camera-return",
            image,
            data: archiveData(source?.data),
            capturePosition: archiveData(source?.capturePosition),
            imageWidth,
            imageHeight,
            capture,
          };
        }
        function repairResourceLabels(data) {
          for (const station of data.stations) {
            if (station.body !== "terra" || !/^P01-\d{3}$/.test(station.id)) continue;
            const item = station.resourceItem ?? Math.floor(station.order / 2);
            const evidence = data.records.find(
              (record2) => record2.body === "terra" && record2.data?.item === item,
            );
            const sample = evidence?.data?.sample ?? data.missions.terra?.samples?.[item]?.sample;
            if (!sample) continue;
            if (station.label === "UNRESOLVED DATUM") {
              const suffix =
                station.archiveRole === "potential"
                  ? `MODEL CANDIDATE ×${station.potentialCount}`
                  : station.archiveRole === "evidence"

            positionPreview();
          });
          addEventListener("scroll", () => positionPreview(), { passive: true });
          image.addEventListener("load", () => positionPreview());
          image.addEventListener("error", () => {
            image.classList.remove("on");
            empty.hidden = false;
            emptyTitle.textContent = "NO IMAGE";
            emptyStatus.textContent = "IMAGE UNAVAILABLE";
            frameSurface.classList.add("empty");
          });
          const returnLink = document.querySelector("[data-return]");
          let returnPage = "planet-01.html";
          try {
            const saved = sessionStorage.getItem("terra-incognita:last-planet");
            if (/^planet-0[123]\.html$/.test(saved)) returnPage = saved;
          } catch {}
          if (returnLink) returnLink.href = returnPage;
          const post = readPostMission();
          if (post && returnLink) returnLink.href = POST_PHASES[post.phase].file;
          returnLink?.addEventListener("click", (event) => {
            if (
              event.button !== 0 ||
              event.metaKey ||
              event.ctrlKey ||
              event.shiftKey ||
              event.altKey ||
              history.length <= 1
            )
              return;
            event.preventDefault();
            history.back();
          });
          render();
        })();
      })();
    </script>
  </body>
</html>
