	/**
	 * A multichannel buffer for use within an AudioWorkletProcessor as a delay line
	 */
	class DelayLine {
		
		constructor(size, channels) {
			this.buffer = [];
			this.writeHead = []
			this.size = size;

			// create the empty channels
			for (let i = 0; i < channels; i++) {
				this.buffer[i] = new Float32Array(this.size);
				this.writeHead[i] = 0;
			}
		}

		/**
		 * Push a value onto the end
		 * @param channel number
		 * @param value number
		 */
		push(channel, value) {
			this.writeHead[channel] += 1;
			if (this.writeHead[channel] > this.size) {
				this.writeHead[channel] = 0;
			}
			this.buffer[channel][this.writeHead[channel]] = value;
		}

		/**
		 * Get the recorded value of the channel given the delay
		 * @param channel number
		 * @param delay number delay samples
		 */
		get(channel, delay) {
			let readHead = this.writeHead[channel] - Math.floor(delay);
			if (readHead < 0) {
				readHead += this.size;
			}
			return this.buffer[channel][readHead];
		}
	}

// Voyage surface ageing: authored deposition and impact masks, not an exposure simulation.
// Coordinates remain attached to vessel components, with no animated noise or extra draw calls.
function installVoyageAgeing(fleet, tier) {
  const detail = tier === 'high' ? 2 : tier === 'mid' ? 1 : 0;
  let treated = 0;
  fleet.forEach((ship, index) => {
    ship.updateMatrixWorld(true);
    const inverse = ship.matrixWorld.clone().invert();
    ship.traverse(mesh => {
      if (!mesh.isMesh) return;
      const toShip = inverse.clone().multiply(mesh.matrixWorld);
      mesh.geometry.computeBoundingBox();
      const bounds = mesh.geometry.boundingBox;
      const partCentre = bounds.min.clone().add(bounds.max).multiplyScalar(.5);
      const partExtent = bounds.max.clone().sub(bounds.min).multiplyScalar(.5);
      partExtent.set(Math.max(partExtent.x,.01),Math.max(partExtent.y,.01),Math.max(partExtent.z,.01));
      const weather = original => {
        if (!original.isMeshStandardMaterial || original.transparent ||
            (original.emissive && original.emissive.getHex() !== 0 && original.emissiveIntensity > .05)) return original;
        const material = original.clone();
        material.name = (original.name || 'hull') + '-voyage-aged';
        material.onBeforeCompile = shader => {
          shader.uniforms.voyageToShip = {value: toShip};
          shader.uniforms.voyagePartCentre = {value:partCentre};
          shader.uniforms.voyagePartExtent = {value:partExtent};
          shader.uniforms.voyageSeed = {value: index * 37.13 + 11.7};
          shader.uniforms.voyageEngineSpan = {value:index===5?142:76};
          shader.vertexShader = 'uniform mat4 voyageToShip; uniform vec3 voyagePartCentre; uniform vec3 voyagePartExtent; varying vec3 vVoyagePart; varying vec3 vVoyageHull;\n' + shader.vertexShader;
          shader.vertexShader = shader.vertexShader.replace('#include <project_vertex>', `
            vVoyagePart = (transformed-voyagePartCentre)/voyagePartExtent;
            vec4 agePosition = vec4(transformed, 1.0);
            #ifdef USE_INSTANCING
              agePosition = instanceMatrix * agePosition;
            #endif
            vVoyageHull = (voyageToShip * agePosition).xyz;
            #include <project_vertex>
          `);
          shader.fragmentShader = `
            uniform float voyageSeed;
            uniform float voyageEngineSpan;
            varying vec3 vVoyagePart;
            varying vec3 vVoyageHull;
            float voyageHash(vec3 p) {
              p = fract(p * .1031); p += dot(p, p.yzx + 33.33);
              return fract((p.x + p.y) * p.z);
            }
            float voyageNoise(vec3 p) {
              vec3 cell = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
              return mix(mix(mix(voyageHash(cell),voyageHash(cell+vec3(1,0,0)),f.x),
                mix(voyageHash(cell+vec3(0,1,0)),voyageHash(cell+vec3(1,1,0)),f.x),f.y),
                mix(mix(voyageHash(cell+vec3(0,0,1)),voyageHash(cell+vec3(1,0,1)),f.x),
                mix(voyageHash(cell+vec3(0,1,1)),voyageHash(cell+vec3(1,1,1)),f.x),f.y),f.z);
            }
          ` + shader.fragmentShader;
          shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `
            #include <color_fragment>
            vec3 ageP = vVoyageHull + vec3(voyageSeed);
            float ageBroad = voyageNoise(ageP * vec3(.033,.046,.022));
            float ageGrain = voyageNoise(ageP * .32);
            float ageDeposit = smoothstep(.39,.71,ageBroad + (ageGrain-.5)*.26);
            // Restrained, uneven discolouration; no terrestrial rust or liquid streaks.
            vec3 ageTint = mix(vec3(.91,.90,.86),vec3(.25,.225,.19),ageDeposit*.83);
            vec3 ageCell = floor(ageP*.17);
            vec3 ageOffset = vec3(voyageHash(ageCell),voyageHash(ageCell+19.2),voyageHash(ageCell+43.8));
            float ageRadius = length(fract(ageP*.17)-(.18+.64*ageOffset));
            float ageWidth = max(fwidth(ageRadius)*1.2,.008);
            float agePit = (1.0-smoothstep(.105-ageWidth,.105+ageWidth,ageRadius))*step(.72,ageOffset.z);
            float ageRim = (1.0-smoothstep(.025,.025+ageWidth,abs(ageRadius-.14)))*step(.72,ageOffset.z);
            diffuseColor.rgb *= mix(vec3(1.0),ageTint,.10) * (1.0-agePit*.072);
            diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb*1.35,ageRim*.03);
            // Rare paint chips: broken edges and a few impact rims, never a full flaking coat.
            vec3 ageEdge = abs(abs(vVoyagePart)-vec3(1.0));
            float ageEdgeDistance = min(max(ageEdge.x,ageEdge.y),min(max(ageEdge.x,ageEdge.z),max(ageEdge.y,ageEdge.z)));
            float ageEdgeMask = 1.0-smoothstep(.018,.060,ageEdgeDistance);
            float ageChip = smoothstep(.69,.83,ageGrain)*step(.72,ageOffset.x)*ageEdgeMask;
            ageChip = max(ageChip,ageRim*step(.96,ageOffset.x)*.65);
            diffuseColor.rgb = mix(diffuseColor.rgb,vec3(.39,.40,.39),ageChip*.78);

            ${detail > 0 ? 'diffuseColor.rgb *= .994+.009*ageGrain;' : ''}
            ${detail > 1 ? 'diffuseColor.rgb *= .9965+.005*voyageNoise(ageP*1.3);' : ''}
          `);
          shader.fragmentShader = shader.fragmentShader.replace('#include <roughnessmap_fragment>', `
            #include <roughnessmap_fragment>
            roughnessFactor = min(1.0, roughnessFactor + ageDeposit*.024 + agePit*.018 - ageChip*.17);

      };
      mesh.material = Array.isArray(mesh.material) ? mesh.material.map(weather) : weather(mesh.material);
