<!DOCTYPE html><meta charset="utf-8"><link rel="icon" href="data:,"><body><canvas id="gl"></canvas>
<script type="importmap">{"imports":{
"three":"../vendor/three.webgpu.js","three/webgpu":"../vendor/three.webgpu.js",

<script type="module">
  window.RESULT = { steps: [], error: null };
  const step = async (name, fn) => {
    const t0 = performance.now();
    try {
      const v = await fn();
      window.RESULT.steps.push([name, "ok", +(performance.now() - t0).toFixed(1), typeof v === "string" ? v : ""]);
      return v;
    } catch (e) {
      window.RESULT.steps.push([name, "THREW", +(performance.now() - t0).toFixed(1), String(e).split("\n")[0]]);
      window.RESULT.error = name;
      throw e;
    }
  };
  const MODE = new URLSearchParams(location.search).get("mode") ?? "work";
  try {
    window.UNIVERSE_SEED = "BEEF01";
    const THREE = await step("import three", () => import("three"));
    const E = await step("import engine barrel", () => import("../engine/index.js"));
    const renderer = new THREE.WebGPURenderer({ canvas: document.getElementById("gl"), forceWebGL: true });
    const camera = new THREE.PerspectiveCamera(46, 1.7, 0.1, 2200);
    const scene = new THREE.Scene();
    if (MODE === "work") {
      const { T, BH, TERRA_RESOURCE_SITES, TERRA_SAMPLE_SITES, BODY02_WATER_SITE } = await step("import work spec", () => import("../works/terra_incognita/spec.js"));
      const S = await step("import work surface", () => import("../works/terra_incognita/surface.js"));
      const { MiniMap } = await step("import local survey atlas", () => import("../engine/core/survey.js"));
      await step("configure(work)", () => {
        const pick = (o) => o[E.deviceTier()];
        const c = E.configure({
          lattice: { seed: T.seedBase + E.universeSeed() >>> 0 },
          metric: { rs: BH.rs },
          vehicle: { cruise: 2, boost: 6 },
          atmosphere: { fogDensity: 0 },
          scatter: {
            rings: [
              { r0: 0, r1: 25.5, seg: 6, cell: pick({ high: 0.085, mid: 0.125, low: 0.21 }) },
              { r0: 22, r1: 67.5, seg: 3, cell: pick({ high: 0.29, mid: 0.42, low: 0.7 }) },
              { r0: 64, r1: 136, seg: 1, cell: pick({ high: 0.66, mid: 1, low: 1.75 }) }
            ],
            fadeBand: 3.5,
            clumpCell: 2.35,
            minPixels: 1.3,
            length: 0.58,
            width: 0.019,
            bend: 0.62,
            breath: 0.17,
            breathRate: 0.21,
            spineBoost: 0.95,
            slopeGate: [0.055, 0.3]
          },
          audio: { droneEmitR: BH.rs * 1.01 }
        });
        return `seed ${c.lattice.seed} \xB7 ${c.scatter.count.toLocaleString()} instances`;
      });
      const C = E.cfg();
      await step("ATLAS \xB7 measured cells, finite memory, isolated bodies", () => {
        const cv = document.createElement("canvas");
        cv.width = 308;
        cv.height = 352;
        const h = (x, z) => Math.sin(x * 0.021) * 3 + Math.cos(z * 0.017) * 2;
        const atlas = new MiniMap(cv, [0, 0], {
          heightAt: h,
          id: "BODY 01",
          label: "TEST PLAIN",
          detailLimit: 48,
          coarseLimit: 16,
          trailLimit: 40
        });
        let now = performance.now() + 1e3;
        for (let i = 0; i < 160; i++, now += 500) {
          const x = i * 3, z = Math.sin(i * 0.12) * 24;
          atlas.update({ x, z, ground: h(x, z) }, now, 0.72, true);
        }
        const a = atlas.stats, snap = atlas.snapshot(), live = atlas.state();
        if (a.detail > 48 || a.coarse > 16 || a.trail > 40)
          throw new Error(`atlas budget exceeded: ${JSON.stringify(a)}`);
        if (!snap.cells.length || snap.cells.length > 1024 || snap.trail.length > 192)
          throw new Error("archive packing failed");
        atlas.reset([600, 500], { id: "BODY 02", label: "TEST DUNE", archives: [snap] });
        if (atlas.stats.detail !== 0 || atlas.stats.coarse !== 0 || atlas.archives.length !== 1)
          throw new Error("new body inherited live terrain instead of archival memory");
        atlas.update({ x: 600, z: 500, ground: h(600, 500) }, now + 500, 0.25, true);
        if ([...atlas.cells.values()].some((p) => p.x < 540) || atlas.archives[0].id !== "BODY 01")
          throw new Error("planet coordinate frames collided");
        const body2 = atlas.snapshot();
        atlas.reset([0, 0], { id: "BODY 01", label: "TEST PLAIN", archives: [body2], memory: live });
        if (atlas.stats.detail !== a.detail || atlas.stats.coarse !== a.coarse || atlas.stats.trail !== a.trail)
          throw new Error("revisited body did not restore its live atlas");
        return `${a.detail} detail + ${a.coarse} coarse \xB7 ${snap.cells.length} archived \xB7 BODY 01 restored`;
      });
      await step("ATLAS TRANSFER \xB7 archive survives, destination stays blank", async () => {
        const cv = document.createElement("canvas");
        cv.width = 308;
        cv.height = 352;
        const atlas = new MiniMap(cv, [0, 0], {
          heightAt: (x, z) => Math.sin(x * 0.02) + Math.cos(z * 0.03),
          id: "BODY 01",
          label: "TEST PLAIN"
        });
        const now = performance.now() + 1e3;
        atlas.update({ x: 18, z: -12, ground: 0 }, now, 0.8, true);
        const memory = atlas.snapshot();
        let swapped = false, arrived = false, surveyCollapse = 0, targetSeen = false;
        const noop = () => {
        };
        const tx = new E.PlanetTransfer({
          minimap: atlas,
          survey: { collapse: (v) => {
            surveyCollapse = v;
          } },
          effect: { beginDeparture: noop, depart: noop, blackout: noop, beginArrival: noop, arrive: noop, finish: noop },
          ambient: { transferCue: noop },
          onBlackout: (_reason, snapshot, destination) => {
            targetSeen = destination.key === "desert";
            atlas.reset([600, 500], {
              id: "BODY 02",
              label: "TEST DUNE",
              archives: [snapshot.atlas]
            });
            swapped = true;
          },
          onArrived: () => {
            arrived = true;
          }
        });
        tx.request("manual", { completion: 0.5, atlas: memory }, {
          key: "desert",
          id: "BODY 02",
          arrivalKo: "\uC2DC\uD5D8 \uD589\uC131 \uC5F0\uACB0",
          arrivalEn: "TEST BODY 02"
        });
        await tx.update(tx.t0 + 5500);
        if (surveyCollapse <= 0 || tx.phase !== "blackout") throw new Error("atlas did not collapse into transfer");
        await tx.update(tx.t0 + 3100);
        if (!swapped || !targetSeen || atlas.id !== "BODY 02" || atlas.stats.detail !== 0 || atlas.archives[0]?.id !== "BODY 01")
          throw new Error("archive/live frame separation failed during blackout");
        await tx.update(tx.t0 + 8300);
        if (tx.active || !arrived) throw new Error("atlas transfer did not finish");
        tx.layer.remove();
        tx.trigger.remove();
        return `${memory.cells.length} cells collapsed \xB7 BODY 01 memory / BODY 02 live blank`;
      });
      await step("VACUUM \xB7 persistent distance fog is absent", () => {
        if (C.atmosphere.fogDensity !== 0) throw new Error(`fog density ${C.atmosphere.fogDensity}`);
        return "fog density 0 \xB7 ballistic emitters only";
      });
      const wake = await step("new Wake      (3 passes, two-track stamp)", () => new E.Wake());
      const ground = await step("new Clipmap   (grid, 2 passes, wake relief)", () => new E.Clipmap({ height: S.heightGPU, shade: S.shadeGround(C.color), albedo: S.albedoGround(C.color), wake }));
      const field = await step("new Field     (curl grid + sampler)", () => new E.Field(ground, { potential: S.potential }));
      const scat = await step("new Scatter   (3 rings, scatter + ribbons)", () => new E.Scatter(ground, field, wake, { shade: S.shadeBlade(C.color) }));
      const sky = await step("buildSky", () => E.buildSky(S.shadeSky));
      const rover = await step("new Rover     (8 wheels, sprung, hinged lid)", () => new E.Rover(camera, document.getElementById("gl"), S.heightCPU));
      const lander = await step("new Lander    (clear bay + six load paths)", () => new E.Lander(S.heightCPU));
      await step("BODY 01 SCAN \xB7 real contact, full stop, 3.6 s integration", () => {
        const recovery = new E.Restoration(lander, S.heightCPU, TERRA_RESOURCE_SITES);
        const site = TERRA_SAMPLE_SITES[0], t0 = performance.now() + 1e3;
        const probe = (distance, speed) => ({
          x: site.x + distance,
          z: site.z,
          speed,
          heading: 0,
          ground: S.heightCPU(site.x + distance, site.z)
        });
        recovery.update(probe(2.1, 0), t0, true);
        if (recovery.event || recovery.shouldHold(probe(2.1, 0)))
          throw new Error("scan or hold begins outside the 2 m contact envelope");
        recovery.update(probe(1.8, 0.2), t0 + 100, true);
        if (recovery.event) throw new Error("moving rover began a contact scan");
        recovery.update(probe(1.8, 0.11), t0 + 200, true);
        if (!recovery.scanning || !recovery.shouldHold(probe(1.8, 0.11)))
          throw new Error("stopped rover did not lock the physical specimen");
        recovery.update(probe(1.8, 0), t0 + 3690, true);
        if (recovery.count !== 0) throw new Error("sample committed before 3.6 s integration");
        recovery.update(probe(1.8, 0), t0 + 3810, true);
        if (recovery.count !== 1 || !recovery.event?.committed)
          throw new Error("full integration did not restore the measured module");
        recovery.reset(0);
        return "d\u22642.0 m \xB7 |v|\u22640.12 m/s \xB7 continuous 3.6 s";
      });
      await step("BODY 01 MANUAL \xB7 alternative sites support out-of-order recovery", () => {
        const recovery = new E.Restoration(lander, S.heightCPU, TERRA_RESOURCE_SITES);
        const site = TERRA_RESOURCE_SITES.find((entry) => entry.item === 4 && entry.variant === 2);
        const t0 = performance.now() + 1e3;
        const probe = {
          x: site.x,
          z: site.z,
          speed: 0,
          heading: 0,
          ground: S.heightCPU(site.x, site.z)
        };
        recovery.update(probe, t0, true);
        recovery.update(probe, t0 + 3610, true);
        if (recovery.count !== 1 || !recovery.acquiredItems[4] || recovery.structuralCount !== 0)
          throw new Error("manual alternative did not acquire the selected raw material out of sequence");
        recovery.update(probe, t0 + 4410, true);
        if (recovery.gaugeValues[0] <= 0 || recovery.target?.item !== 0)
          throw new Error("raw gauge or autonomous fallback target did not remain coherent");
        recovery.reset(0);
        return "18 manifestations \xB7 arbitrary resource order \xB7 deterministic auto fallback";
      });
      await step("BODY 01 GRAMMAR \xB7 six behaviours, six traces, field subtraction", () => {
        const recovery = new E.Restoration(lander, S.heightCPU, TERRA_RESOURCE_SITES);
        const grammars = new Set(recovery.sites.map((site) => site.root.userData.resource.grammar));
        if (grammars.size !== 6) throw new Error(`expected six material grammars, got ${grammars.size}`);
        const site = TERRA_SAMPLE_SITES[0], t0 = performance.now() + 1e3;
        const probe = {
          x: site.x,
          z: site.z,
          speed: 0,
          heading: 0,
          ground: S.heightCPU(site.x, site.z)
        };
        if (!recovery.acquireAll(probe, t0)) throw new Error("test acquisition did not begin");
        const opening = recovery.snapshot().fieldSubtraction;
        if (!opening.active || opening.traces !== 6 || opening.potentials !== 12)
          throw new Error(`subtraction did not begin with 6/12 split: ${JSON.stringify(opening)}`);
        recovery.update(probe, t0 + 1900, true);
        const final = recovery.snapshot().fieldSubtraction;
        const visibleTraces = recovery.sites.filter((entry) => entry.trace.visible).length;
        const visiblePotentials = recovery.sites.filter((entry) => !entry.acquired && entry.matter.visible).length;
        if (!final.complete || final.progress < 0.999 || visibleTraces !== 6 || visiblePotentials !== 0)
          throw new Error(`field subtraction did not leave six traces: ${JSON.stringify({ final, visibleTraces, visiblePotentials })}`);
        recovery.reset(0);
        return `${grammars.size} behaviours \xB7 18 manifestations \u2192 6 coordinate traces`;
      });
      await step("FIELD ARCHIVE \xB7 selected evidence and resolved potential", () => {
        const storage = {
          value: null,
          getItem() { return this.value; },
          setItem(_key, value) { this.value = value; },
          removeItem() { this.value = null; }
        };
        const archive = new E.FieldArchive({ storage, key: "harness:field-archive" });
        archive.registerStations(TERRA_RESOURCE_SITES.filter((site) => site.item === 0 && site.variant < 2).map((site, order) => ({
          id: `P01-${String(order + 1).padStart(3, "0")}`,
          body: "terra",
          planet: "PLANET 01",
          world: "SHEAR WORLD",
          label: `FE\u2013NI PLATES \xB7 FIELD ${site.variant + 1}`,
          x: site.x,
          z: site.z,
          radius: 13,
          order,
          resourceItem: site.item,
          resourceVariant: site.variant,
          archiveRole: "unresolved"
        })));
        const selected = TERRA_RESOURCE_SITES.find((site) => site.item === 0 && site.variant === 2);
        archive.resolveResource({
          itemIndex: 0,
          site: { ...selected, label: "FE\u2013NI PLATES" },
          alternatives: TERRA_RESOURCE_SITES,
          rover: { heading: 0 },
          shot: "DETAIL",
          now: 4200,
          image: "data:image/webp;base64,AA=="
        });
        const snapshot = archive.snapshot();
        const evidence = snapshot.stations.find((station) => station.archiveRole === "evidence");
        const potential = snapshot.stations.find((station) => station.archiveRole === "potential");
        if (!evidence || !potential || potential.potentialCount !== 2 || snapshot.records.length !== 1 || snapshot.records[0].kind !== "resource-evidence")
          throw new Error(`archive resolution failed: ${JSON.stringify(snapshot)}`);
        const legacyValues = new Map([["terra-incognita:field-archive:v2", JSON.stringify({
          version: 2,
          stations: [{ id: "P02-001", body: "desert", order: 0 }],
          records: [{ id: "P02-001", body: "desert", image: "data:image/webp;base64,AA==" }]
        })]]);
        const migrated = new E.FieldArchive({ storage: {
          getItem: (key) => legacyValues.get(key) ?? null,
          setItem: (key, value) => legacyValues.set(key, value),
          removeItem: (key) => legacyValues.delete(key)
        } }).snapshot();
        if (migrated.version !== 3 || migrated.records.length !== 1 || !legacyValues.has("terra-incognita:field-archive:v3"))
          throw new Error(`v2 archive did not migrate: ${JSON.stringify(migrated)}`);
        return "1 evidence image \xB7 2 unchosen sites \xB7 v2 records migrated to v3";
      });
      await step("scene.add all", () => {
        scene.add(sky, ground.mesh, ...scat.meshes, rover.group, lander.group);
        return scene.children.length + " children";
      });
      await step("BODY 03 MEMORY \xB7 persistent fields + GPU storage compute", () => {
        const memory = new E.MissionMemory({ storage: {
          getItem: () => null,
          setItem: () => {
          },
          removeItem: () => {
          }
        }, key: "harness:memory" });
        memory.recordSamples({
          count: 6,
          items: E.RESTORATION_ITEMS,
          sites: TERRA_SAMPLE_SITES
        });
        memory.recordWater({ complete: true, site: BODY02_WATER_SITE });
        const model = memory.composeBody03({ start: [120, 460] });
        const geological = new E.GeologicalMemory({ renderer, heightAt: S.heightCPU });
        if (!geological.activate(model, performance.now())) throw new Error("BODY 03 mission did not activate");
        const state = geological.snapshot();
        if (!memory.ready || state.total !== 3 || !state.gpu.enabled || state.gpu.backend !== "webgpu-storage-compute" || state.gpu.particles < 300 || geological.fieldData?.value?.array?.length !== state.gpu.particles * 4)
          throw new Error(`geological compute buffers incomplete: ${JSON.stringify(state.gpu)}`);
        scene.add(geological.group);
        window.__geologicalMemory = geological;
        return `4 structure + 2 raw materials + H\u2082O \u2192 ${state.total} nodes \xB7 ${state.gpu.particles} GPU particles`;
      });
      await step("new Hud / Captions / Kiosk / Ambient", () => {
        new E.Hud([["A", [["x", "X"]]]]);
        new E.Captions([]);
        new E.Kiosk(9e4);
        new E.Ambient();
      });
      await step("new Lens      (pass + dof + bloom)", () => new E.Lens(renderer, scene, camera));
      const power = await step("new Power     (array, shadow probe, budget)", () => new E.Power(S.heightCPU));
      await step("POWER \xB7 blueshift gain shares the renderer ceiling", () => {
        const r = BH.rs * 1.000001;
        const raw = Math.pow(E.nuRatioCPU(1e7, r), 4);
        const capped = E.blueshiftGainCPU(1e7, r);
        power.reset();
        const pw = power.update(0, {
          pitch: 0,
          roll: 0,
          heading: 0,
          x: 0,
          z: r,
          ground: S.heightCPU(0, r),
          radius: r,
          speed: 0,
          traction: 1,
          lamps: false,
          lidTilt: 0
        });
        if (capped !== E.BLUESHIFT_GAIN_MAX || pw.blueshiftGain !== E.BLUESHIFT_GAIN_MAX)
          throw new Error(`renderer/power ceiling mismatch: ${capped} / ${pw.blueshiftGain}`);
        return `raw q\u2074 ${raw.toExponential(2)} \u2192 ${pw.blueshiftGain.toFixed(1)}\xD7`;
      });
      const drive = (x, z, heading, seconds, lamps = true, lid = 0) => {
        rover.reset(x, z, heading);
        rover.lamps = lamps;
        rover.lidTilt = lid;
        rover.disabled = false;
        power.reset();
        rover.keys.add("KeyW");
        let mp = 0, mr = 0, mt = 1, sp = 0, sr = 0, n = 0, v;
        let shadow = 0, diedAt = -1, pw = null;
        for (let i = 0; i < seconds * 60; i++) {
          v = rover.update(1 / 60);
          pw = power.update(1 / 60, { ...v, lamps: rover.lamps, lidTilt: rover.lidTilt });
          rover.disabled = pw.dead;
          if (!pw.sunlit) shadow++;
          if (pw.dead && diedAt < 0) diedAt = i / 60;
          mp = Math.max(mp, Math.abs(v.pitch));
          mr = Math.max(mr, Math.abs(v.roll));
          mt = Math.min(mt, v.traction);
          sp += Math.abs(v.pitch);
          sr += Math.abs(v.roll);
          n++;
        }
        rover.keys.delete("KeyW");
        return {
          v,
          pw,
          meanPitch: sp / n * 57.3,
          meanRoll: sr / n * 57.3,
          maxPitch: mp * 57.3,
          maxRoll: mr * 57.3,
          minTraction: mt,
          shadowPct: (100 * shadow / n).toFixed(0),
          diedAt
        };
      };
      await step("drive 40 s from the start (r 620 \u2192 inward)", () => {
        const d = drive(BH.start[0], BH.start[1], Math.atan2(BH.start[0], BH.start[1]), 40);
        return `${d.v.odometer.toFixed(0)} m \xB7 r ${d.v.radius.toFixed(0)} m \xB7 pitch mean ${d.meanPitch.toFixed(1)}\xB0 max ${d.maxPitch.toFixed(1)}\xB0 \xB7 traction min ${(d.minTraction * 100).toFixed(0)}%`;
      });
      await step("ROVER model \xB7 geometry and mass budget", () => {
        let meshes = 0, tris = 0;
        rover.group.traverse((o) => {
          if (o.isMesh) {
            meshes++;
            const g = o.geometry;
            tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
          }
        });
        const wheels = rover.wheels.length;
        if (tris < 52e3 || tris > 62e3)
          throw new Error(`rover triangle budget ${Math.round(tris).toLocaleString()} is outside 52\u201362k`);
        if (meshes > 160) throw new Error(`rover draw-call budget exceeded: ${meshes} meshes`);
        return `${meshes} meshes \xB7 ${Math.round(tris).toLocaleString()} triangles \xB7 ${wheels} wheels \xB7 lid ${rover.lid ? "hinged" : "MISSING"}`;
      });
      await step("ROVER design \xB7 expedition systems remain present", () => {
        const roles = new Map();
        rover.group.traverse((o) => {
          const role = o.userData.designRole;
          if (role) roles.set(role, (roles.get(role) ?? 0) + 1);
        });
        for (const role of ["armoured-hull", "service-panels", "suspension-pivots", "front-service-array", "camera-mast-structure", "solar-gimbal", "solar-array", "solar-backplane", "solar-cell-matrix", "avionics-pod", "sample-arm", "lidar-cluster"])
          if (roles.get(role) !== 1) throw new Error(`${role}: expected 1, got ${roles.get(role) ?? 0}`);
        if (roles.get("suspension-coil") !== 8)
          throw new Error(`suspension-coil: expected 8, got ${roles.get("suspension-coil") ?? 0}`);
        const wheelLayers = rover.wheels[0]?.children.filter((o) => o.isMesh) ?? [];
        if (wheelLayers.length !== 2 || wheelLayers[0].material === wheelLayers[1].material)
          throw new Error("wheel rubber and metal layers are not materially separated");
        let front = null;
        rover.group.traverse((o) => {
          if (o.userData.designRole === "front-service-array") front = o;
        });
        if (!front || front.children.filter((o) => o.isMesh).length < 4)
          throw new Error("front fascia is not a layered four-stage assembly");
        let mast = null;
        rover.group.traverse((o) => {
          if (o.userData.designRole === "camera-mast-structure") mast = o;
        });
        if (!mast || mast.children.filter((o) => o.isMesh).length < 7)
          throw new Error("camera mast lacks base/yoke/brace/duct load path");
        return "layered armour \xB7 closed nose \xB7 grounded twin camera mast \xB7 6\xD712 cell matrix \xB7 rubber/metal wheels";
      });
      await step("ROVER \xB7 autonomous survey hold is a true stop", () => {
        rover.reset(BH.start[0], BH.start[1], Math.atan2(BH.start[0], BH.start[1]));
        rover.auto = true;
        rover.missionHold = true;
        for (let i = 0; i < 240; i++) rover.update(1 / 60);
        if (rover.odometer > 1e-5 || Math.abs(rover.speed) > 1e-5)
          throw new Error("autonomous survey hold still drives the rover");
        rover.missionHold = false;
        for (let i = 0; i < 120; i++) rover.update(1 / 60);
        if (rover.odometer < 1) throw new Error("autonomous route does not resume after survey hold");
        return "14 s mission pauses can remain mechanically still";
      });
      await step("TRANSFER \xB7 ordered parts, material points, exact restore", () => {
        const fx = new E.ResolutionTransferFX(rover.group);
        scene.add(fx.group);
        rover.reset(BH.start[0], BH.start[1], Math.atan2(BH.start[0], BH.start[1]));
        rover.chase = true;
        rover.update(0);
        const before = new Map();
        const beforePos = new Map();
        rover.group.traverse((o) => {
          if (o.isMesh) before.set(o, o.visible);
        });
        rover.group.traverse((o) => {
          if (o.userData.transferRig || o.userData.transferChassis) beforePos.set(o, o.position.clone());
        });
        const palette = { signal:  new Set(), panel:  new Set(), wheel:  new Set(), body:  new Set() };
        rover.group.traverse((mesh) => {
          if (!mesh.isMesh) return;
          let node = mesh, part = "body";
          while (node && node !== rover.group) {
            if (node.userData.transferPart) {
              part = node.userData.transferPart;
              break;
            }
            node = node.parent;
          }
          if (mesh.userData.transferColor != null) palette[part].add(mesh.userData.transferColor);

        return window.__shaderErrors.length ? `${window.__shaderErrors.length} shader error(s)` : "compiled clean";
      });
      await step("read back the generated fragment shader", async () => {
        const src = await renderer.debug.getShaderAsync(scene, camera, ground.mesh);
        window.__shader = src;
        const f = (src.fragmentShader ?? "") + "";
        const uniforms = [...f.matchAll(/uniform[^;]*;/g)].length;
        const hasLamp = /lamp|Lamp/.test(f) || /smoothstep\s*\(\s*0\.891/.test(f);
        const buffers = [...f.matchAll(/(?:buffer|readonly buffer|layout[^;]*?)\s+(\w*Buffer\w*|\w*Storage\w*)/gi)].length;
        const bindings = [...f.matchAll(/^\s*(?:layout|uniform|buffer|readonly)/gm)].length;
        window.__fragSrc = f;
        window.__vertSrc = (src.vertexShader ?? "") + "";
        return `fragment ${f.length} chars \xB7 ${uniforms} uniform \xB7 ${bindings} binding lines \xB7 lamp ${hasLamp ? "PRESENT" : "ABSENT"}`;
      });
      await step("stamp two wheel tracks into the wake by hand", () => {
        const G = wake.grid, CELL = wake.cell, arr = wake.buf.value.array;
        window.__trackFill = (on) => {
          for (let row = 0; row < G; row++) for (let col = 0; col < G; col++) {
            const x = (col - (G - 1) / 2) * CELL, z = (row - (G - 1) / 2) * CELL;
            let v = 0;
            if (on && Math.abs(z) < 14) {
              for (const tx of [-0.72, 0.72]) {
                const d = (x - tx) / 0.42;
                v = Math.max(v, Math.exp(-0.5 * d * d));
              }
            }
            arr[row * G + col] = v;
          }
          wake.buf.value.needsUpdate = true;
        };
        window.__trackFill(true);
        return `${G}\xB2 grid, two gaussian tracks at \xB10.72 m`;
      });
      await step("lamp A/B by reading the framebuffer directly", async () => {
        const cv = document.getElementById("gl");
        const gl = cv.getContext("webgl2");
        const W = cv.width, H = cv.height;
        const sample = async (on2) => {
          E.uLampPower.value = on2 ? 1 : 0;
          await renderer.renderAsync(scene, camera);
          const px = new Uint8Array(W * H * 4);
          gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
          return px;
        };
        const off = await sample(false), on = await sample(true);
        window.__trailAB = async () => {
          E.uLampPower.value = 1;
          window.__trackFill(false);
          await renderer.renderAsync(scene, camera);
          const a = new Uint8Array(W * H * 4);
          gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, a);
          window.__trackFill(true);
          await renderer.renderAsync(scene, camera);
          const b = new Uint8Array(W * H * 4);
          gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, b);
          let peak2 = 0, hit = 0, total2 = 0;
          const map2 = [];
          for (let y = H - 1; y >= 0; y -= Math.max(1, H / 26 | 0)) {
            const row = [];
            for (let x = 0; x < W; x += Math.max(1, W / 100 | 0)) {
              const i = (y * W + x) * 4;
              const d = Math.abs(b[i] - a[i]) + Math.abs(b[i + 1] - a[i + 1]) + Math.abs(b[i + 2] - a[i + 2]);
              row.push(d);
              peak2 = Math.max(peak2, d);
              if (d > 3) hit++;
              total2++;
            }
            map2.push(row);
          }
          return { map: map2, peak: peak2, pct: (100 * hit / total2).toFixed(1) };
        };
        let peak = 0, lit = 0, total = 0;
        const map = [];
        for (let y = H - 1; y >= 0; y -= Math.max(1, H / 26 | 0)) {
          const row = [];
          for (let x = 0; x < W; x += Math.max(1, W / 100 | 0)) {
            const i = (y * W + x) * 4;
            const d = Math.max(0, on[i] - off[i], on[i + 1] - off[i + 1], on[i + 2] - off[i + 2]);
            row.push(d);
            peak = Math.max(peak, d);
            if (d > 2) lit++;
            total++;
          }
          map.push(row);
        }
        window.__lampMap = { map, peak, pct: (100 * lit / total).toFixed(1) };
        return `peak +${peak}/255 \xB7 ${(100 * lit / total).toFixed(1)}% of pixels brighter`;
      });
      await step("budget", () => `${C.scatter.count.toLocaleString()} inst / ${(C.scatter.vertices / 1e6).toFixed(2)}M verts / ground ${C.clipmap.count.toLocaleString()}`);
    } else {
      const { Fn, float, vec3, sin, cos } = await import("three/tsl");
      await step("configure(minimal work, no metric)", () => {
        const c = E.configure({
          lattice: { seed: 7 },
          clipmap: { grid: 256, span: 200 },
          field: { grid: 128, span: 200 },
          scatter: {
            rings: [{ r0: 0, r1: 40, seg: 3, cell: 0.5 }],
            fadeBand: 3,
            clumpCell: 2,
            minPixels: 1.3,
            length: 0.4,
            width: 0.02,
            bend: 0.5,
            breath: 0.1,
            breathRate: 0.2,
            slopeGate: [0.1, 0.4]
          }
        });
        return `metric ${c.metric === null ? "none" : "set"} \xB7 ${c.scatter.count.toLocaleString()} instances`;
      });
      const dunes = Fn(([p]) => sin(p.x.mul(0.05)).mul(cos(p.y.mul(0.04))).mul(6));
      const ground = await step("new Clipmap   (a different surface)", () => new E.Clipmap({
        height: dunes,
        shade: ({ normal }) => vec3(0.05, 0.05, 0.06).mul(normal.y)
      }));
      const field = await step("new Field     (a different potential)", () => new E.Field(ground, { potential: (p) => E.fbm(p.mul(0.01), 3) }));
      const wake = await step("new Wake", () => new E.Wake());
      await step("new Scatter   (one ring)", () => new E.Scatter(ground, field, wake, {}));
      await step("buildSky      (engine default)", () => E.buildSky());
      await step("redshift is identity without a metric", () => {
        const q = E.nuRatioCPU(10, 100);
        if (q !== 1) throw new Error("nuRatioCPU should be 1 with no metric, got " + q);
        if (E.lapseAt(10) !== 1) throw new Error("lapseAt should be 1 with no metric");
        return "\u03BD ratio 1, lapse 1 \u2014 no branches, no cost";
      });
    }
  } catch (e) {
  }
  window.RESULT.done = true;
</script></body>
